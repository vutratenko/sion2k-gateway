apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sion2k-gateway
  namespace: shturval-cd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway-system
  source:
    repoURL: https://github.com/vutratenko/sion2k-gateway.git
    targetRevision: main
    path: dist
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
